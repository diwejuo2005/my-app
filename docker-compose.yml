# Local development services. Start with `docker compose up -d`.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: instereo
      POSTGRES_PASSWORD: instereo
      POSTGRES_DB: instereo
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U instereo"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres-data:
